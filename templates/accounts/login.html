{% extends "base.html" %}{% block title %}Log in{% endblock %}
{% block content %}<div class="row justify-content-center"><div class="col-md-6 col-lg-5"><div class="card shadow-sm"><div class="card-body p-4">
<h1 class="h3 mb-3">Log in</h1>
<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary w-100">Log in</button></form>
<p class="mt-3 mb-0"><a href="{% url 'register' %}">Create an account</a> · <a href="{% url 'password_reset' %}">Forgot password?</a></p>
</div></div></div></div>{% endblock %}
